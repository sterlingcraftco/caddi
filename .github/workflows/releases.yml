name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on tags like v1.0.0, v2.1.3, etc.

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Go
        uses: actions/setup-go@v2
        with:
          go-version: '1.24'

      - name: Build Linux AMD64
        run: GOOS=linux GOARCH=amd64 go build -o caddi-linux-amd64 main.go

      - name: Build Linux ARM64
        run: GOOS=linux GOARCH=arm64 go build -o caddi-linux-arm64 main.go

      - name: Build macOS AMD64
        run: GOOS=darwin GOARCH=amd64 go build -o caddi-darwin-amd64 main.go

      - name: Build macOS ARM64
        run: GOOS=darwin GOARCH=arm64 go build -o caddi-darwin-arm64 main.go

      - name: Build Windows AMD64
        run: GOOS=windows GOARCH=amd64 go build -o caddi-windows-amd64.exe main.go

      - name: Upload Release Assets
        uses: ncipollo/release-action@v1
        with:
          assets: |
            caddi-linux-amd64
            caddi-linux-arm64
            caddi-darwin-amd64
            caddi-darwin-arm64
            caddi-windows-amd64.exe
